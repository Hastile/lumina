[project]
name = "lumina-engine"
version = "0.1.0"
description = "Lumina video editor engine: document model, commands, analysis, RPC and MCP server"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "websockets>=13",
    "mcp[cli]>=1.2",
]

[project.scripts]
lumina = "lumina.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
