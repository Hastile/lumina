<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina 컷 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151c;color:#e4eaf2;font:14px system-ui}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;padding:10px 14px;background:#202733}header small{color:#9eafc0}.preview{position:sticky;top:0;background:#11151c;z-index:5;padding-bottom:6px}#program{display:block;width:100%;height:min(30vh,260px);object-fit:contain;background:#05070b}#frameStatus{padding:6px;color:#6ee7c2;font-size:12px}#info{font-size:12px;color:#a9b8ca;margin:8px 0}button,select,input{font:inherit}button,select{color:#e4eaf2;background:#273344;border:1px solid #4a5c70;border-radius:7px;padding:10px;min-height:44px}button:active{background:#416c77}.row{display:flex;gap:6px;align-items:center;margin:8px 0}.row button{flex:1;padding:8px 4px;font-size:12px;white-space:nowrap}input[type=range]{width:100%;accent-color:#61dec2;min-height:34px}#time{font:bold 22px ui-monospace;display:block;text-align:center;padding:4px}label,.note{font-size:12px;color:#9eadc0}.fine{background:#1c2633;border-radius:8px;padding:8px}#timeline{overflow:auto;max-height:33vh;border:1px solid #405065;margin-top:10px}.track{display:flex;height:44px;border-bottom:1px solid #334050}.label{width:78px;flex-shrink:0;position:sticky;left:0;z-index:2;background:#202d3d;font-size:11px;padding:6px;overflow:hidden}.lane{position:relative;flex-shrink:0}.clip{position:absolute;top:3px;height:36px;min-height:0;background:#365d88;border:1px solid #6a99ca;border-radius:3px;padding:3px;overflow:hidden;white-space:nowrap;font-size:11px}.audio .clip{background:#285e50}.clip.active{border:2px solid #6ff5d3}.cursor{position:absolute;top:0;bottom:0;width:2px;background:#ff706b;pointer-events:none}.ruler{position:relative;height:34px;touch-action:none;background:#28384c}.ruler span{position:absolute;font-size:10px;pointer-events:none}.card{padding:9px;margin:6px 0;background:#202a38;border-left:3px solid #61dec2;line-height:1.5}.card small{display:block;color:#aabacf}#reference{width:100%;min-height:120px;background:#111820;color:#c5d5e7;border:1px solid #4a5c70;padding:8px}#error{color:#ffb4a9}.note{line-height:1.5}#follow.on{border-color:#61dec2}#fineLabels{display:flex;justify-content:space-between;color:#aabacf;font-size:11px}
</style><header><b>Lumina · 컷 확인</b><small id="status">연결 중</small></header><main>
<div class="preview"><img id="program" alt="현재 선택 프레임"><div id="frameStatus">프레임 대기</div></div><div id="info"></div><div id="error" role="status"></div>
<div class="row"><button id="follow" class="on">PC 위치 따라가기</button><button id="refresh">상태 새로고침</button></div><output id="time">00:00:00:00</output>
<label>전체 위치 · 크게 이동</label><input id="seek" type="range" min="0" max="1" step="1" aria-label="전체 재생헤드">
<div class="fine"><label>정밀 이동 · 현재 중심 앞뒤 5초</label><input id="fine" type="range" min="0" max="1" step="1" aria-label="정밀 재생헤드"><div id="fineLabels"><span id="fineStart"></span><span id="fineEnd"></span></div></div>
<div class="row"><button id="backSecond">−1초</button><button id="backFrame">◀ 1프레임</button><button id="nextFrame">1프레임 ▶</button><button id="nextSecond">+1초</button></div>
<div class="row"><label for="cutTrack">컷 기준</label><select id="cutTrack" aria-label="컷 이동 기준 트랙"></select></div>
<div class="row"><button id="previousCut">◀ 이전 경계</button><button id="nextCut">다음 경계 ▶</button></div>
<div class="row"><button id="clipStart">선택 클립 처음</button><button id="clipLast">선택 클립 마지막 프레임</button></div>
<div class="row"><label>타임라인 확대</label><select id="zoom"><option value="30">넓게</option><option value="70" selected>보통</option><option value="140">크게</option></select><button id="center">재생헤드 보이기</button></div>
<div class="note">눈금을 좌우로 끌거나 클립 안의 원하는 위치를 누르세요. 아래는 그 위치에 걸린 클립입니다.</div><div id="timeline"></div><div id="selected"></div>
<div class="row"><button id="copy">Chat에 전달할 위치 복사</button></div><textarea id="reference" readonly aria-label="Chat에 전달할 클립 정보"></textarea>
<p class="note">휴대폰에서만 위치를 이동합니다. PC 편집·재생헤드는 변경하지 않습니다. 영상 구간 렌더 없이 선택 프레임만 조회합니다. 새 이미지가 준비될 때까지 이전 이미지는 흐리게 표시됩니다.</p></main>
<script>
const $=id=>document.getElementById(id),TPS=254016000000;let state=null,follow=true,pos=0,fineCenter=0,selected=null,busy=false,pending=false,timer=null,lastShape='',frameURL=null,revision=0,polling=false;
function fps(){const s=state.timeline.settings;return s.fps_num/s.fps_den}function maxFrame(){return Math.max(0,Math.ceil(state.timeline.duration.ticks/TPS*fps())-1)}function ticks(){return Math.round(pos*TPS/fps())}function seconds(){return pos/fps()}function fmt(n){if(!state)return '';let rate=Math.ceil(fps()),sec=Math.floor(n/rate);return [Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60,n%rate].map(v=>String(v).padStart(2,'0')).join(':')}function allTracks(){return [...state.timeline.video_tracks].reverse().concat(state.timeline.audio_tracks)}function starts(c){return Math.round(c.start.ticks/TPS*fps())}function ends(c){return Math.round(c.end.ticks/TPS*fps())}function cutTrack(){return allTracks().find(t=>t.id===$('cutTrack').value)}
function focusTimeline(){const x=seconds()*Number($('zoom').value);$('timeline').scrollLeft=Math.max(0,x-($('timeline').clientWidth-78)/2)}
function range(){let radius=Math.round(fps()*5);$('fine').min=Math.max(0,fineCenter-radius);$('fine').max=Math.min(maxFrame(),fineCenter+radius);$('fineStart').textContent=fmt(Number($('fine').min));$('fineEnd').textContent=fmt(Number($('fine').max))}
function choose(n,recenter=true){if(!state)return;follow=false;pos=Math.max(0,Math.min(maxFrame(),Math.round(n)));revision++;if(recenter){fineCenter=pos;range();focusTimeline()}sync();schedule()}
function schedule(){pending=true;$('program').style.opacity='.35';$('frameStatus').textContent='선택 '+fmt(pos)+' · 프레임 불러오는 중';clearTimeout(timer);timer=setTimeout(frame,100)}
function sync(){if(!state)return;$('time').textContent=fmt(pos)+' · '+pos+'f';$('seek').max=maxFrame();$('seek').value=pos;$('fine').value=pos;$('follow').textContent=follow?'PC 위치 따라가는 중':'PC 위치로 돌아가기';$('follow').classList.toggle('on',follow);document.querySelectorAll('.cursor').forEach(e=>e.style.left=seconds()*Number($('zoom').value)+'px');document.querySelectorAll('.clip').forEach(e=>e.classList.toggle('active',pos>=Number(e.dataset.start)&&pos<Number(e.dataset.end)));cards()}
function cards(){const hits=[];for(const t of allTracks())for(const c of t.clips)if(pos>=starts(c)&&pos<ends(c))hits.push({t,c});const box=$('selected');box.replaceChildren();for(const {t,c} of hits){const el=document.createElement('div');el.className='card';const b=document.createElement('b');b.textContent=t.label+' · '+c.name;const sub=document.createElement('small');sub.textContent=c.start.timecode+' → '+c.end.timecode+' (끝 제외) · '+(c.enabled?'활성':'비활성')+(t.flags.hidden?' · 트랙 숨김':'')+(t.flags.muted?' · 음소거':'')+' · '+c.speed+'×';el.append(b,sub);el.onclick=()=>{selected={t,c};$('clipStart').textContent=t.label+' 클립 처음';$('clipLast').textContent=t.label+' 마지막 프레임';cards()};box.append(el)}if(!hits.length)box.textContent='이 위치에 클립이 없습니다';const basis=cutTrack();if(basis&&!hits.some(h=>h.t.id===basis.id)){const empty=document.createElement('div');empty.className='card';empty.textContent=basis.label+' '+basis.name+' · 이 위치에 클립 없음';box.prepend(empty)}const target=selected&&hits.find(h=>h.c.id===selected.c.id)||hits.find(h=>h.t.id===$('cutTrack').value)||hits[0];selected=target||null;$('clipStart').disabled=!target;$('clipLast').disabled=!target;const lines=['프로젝트: '+state.project.name,'시퀀스: '+state.timeline.name+' ('+state.timeline.id+')','확인 위치: '+fmt(pos)+' / '+pos+'f / '+ticks()+' ticks','이 위치를 기준으로 수정해줘.'];for(const {t,c} of hits)lines.push(t.label+' '+t.name+' | '+c.name+' | 클립 ID '+c.id+' | '+c.start.timecode+' ~ '+c.end.timecode+' (끝 제외) | source_in '+c.source_in.timecode+' | speed '+c.speed);$('reference').value=lines.join('\n')}
function render(){const px=Number($('zoom').value),w=Math.max(300,state.timeline.duration.seconds*px),box=$('timeline'),scroll=box.scrollLeft;box.replaceChildren();const ruler=document.createElement('div');ruler.className='ruler';ruler.style.width=(w+78)+'px';for(let s=0;s<state.timeline.duration.seconds;s+=Math.max(1,Math.ceil(90/px))){let e=document.createElement('span');e.style.left=(78+s*px)+'px';e.textContent=fmt(Math.round(s*fps()));ruler.append(e)}const move=e=>choose((e.clientX-ruler.getBoundingClientRect().left-78)/px*fps(),false);ruler.onpointerdown=e=>{ruler.setPointerCapture(e.pointerId);move(e)};ruler.onpointermove=e=>{if(ruler.hasPointerCapture(e.pointerId))move(e)};ruler.onpointerup=e=>{ruler.releasePointerCapture(e.pointerId);fineCenter=pos;range();schedule()};box.append(ruler);for(const t of allTracks()){let row=document.createElement('div');row.className='track '+(t.label.startsWith('A')?'audio':'');let label=document.createElement('div');label.className='label';label.textContent=t.label+' '+t.name;let lane=document.createElement('div');lane.className='lane';lane.style.width=w+'px';lane.onclick=e=>{choose((e.clientX-lane.getBoundingClientRect().left)/px*fps())};for(const c of t.clips){let el=document.createElement('button');el.className='clip';el.style.left=c.start.seconds*px+'px';el.style.width=Math.max(3,(c.end.seconds-c.start.seconds)*px)+'px';el.textContent=c.name;el.dataset.start=starts(c);el.dataset.end=ends(c);el.onclick=e=>{e.stopPropagation();selected={t,c};choose((e.clientX-lane.getBoundingClientRect().left)/px*fps())};lane.append(el)}let cur=document.createElement('div');cur.className='cursor';lane.append(cur);row.append(label,lane);box.append(row)}box.scrollLeft=scroll;sync()}
async function frame(){if(!state||busy)return;pending=false;busy=true;const wanted=revision,p=state.project.key,s=state.timeline.id,n=pos;try{const r=await fetch('/api/frame?'+new URLSearchParams({project:p,sequence:s,ticks:ticks()}));if(!r.ok)throw Error('프레임 조회 실패 · 다시 시도하세요');const blob=await r.blob();if(revision!==wanted||state.project.key!==p||state.timeline.id!==s){pending=true;return}const url=URL.createObjectURL(blob);$('program').src=url;if(frameURL)URL.revokeObjectURL(frameURL);frameURL=url;$('program').style.opacity='1';$('frameStatus').textContent='표시된 프레임 '+fmt(n)+' · '+n+'f';$('error').textContent=''}catch(e){$('error').textContent=e.message;$('frameStatus').textContent='이미지 미갱신 · 선택 위치 '+fmt(pos)}finally{busy=false;if(pending){clearTimeout(timer);timer=setTimeout(frame,0)}}}
async function poll(){if(polling)return;polling=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error('PC Lumina 연결 대기');const next=await r.json();const changed=!state||state.project.key!==next.project.key||state.timeline.id!==next.timeline.id;state=next;if(changed){follow=true;selected=null;revision++;$('program').removeAttribute('src');const select=$('cutTrack');select.replaceChildren();for(const t of allTracks()){let o=document.createElement('option');o.value=t.id;o.textContent=t.label+' '+t.name;select.append(o)}select.value=state.timeline.video_tracks[0]?.id||select.value}if(follow){let n=Math.round(state.timeline.playhead.ticks/TPS*fps());if(n!==pos)revision++;pos=n;fineCenter=pos}pos=Math.max(0,Math.min(maxFrame(),pos));range();$('info').textContent=state.project.name+' / '+state.timeline.name+' · '+(state.project.dirty?'미저장 변경 있음':'저장됨');$('status').textContent='연결됨';const shape=JSON.stringify([state.timeline.id,state.timeline.video_tracks,state.timeline.audio_tracks,state.timeline.duration]);if(shape!==lastShape){lastShape=shape;render()}sync();if(changed)focusTimeline();if(!busy)schedule()}catch(e){$('status').textContent='연결 대기';$('error').textContent=e.message;$('program').style.opacity='.35'}finally{polling=false}}
$('seek').oninput=()=>choose(Number($('seek').value));$('fine').oninput=()=>choose(Number($('fine').value),false);$('fine').onchange=()=>{fineCenter=pos;range();focusTimeline();schedule()};$('follow').onclick=()=>{follow=true;void poll().then(focusTimeline)};$('refresh').onclick=()=>void poll();$('zoom').onchange=()=>{render();focusTimeline()};$('center').onclick=focusTimeline;$('cutTrack').onchange=()=>sync();
for(const [id,step] of [['backFrame',-1],['nextFrame',1],['backSecond',-1],['nextSecond',1]])$(id).onclick=()=>{choose(pos+(id.includes('Second')?Math.round(fps()):1)*step);focusTimeline()};
function boundary(dir){const t=cutTrack();if(!t)return;const list=[...new Set(t.clips.flatMap(c=>[starts(c),ends(c)]))].sort((a,b)=>a-b);const n=dir>0?list.find(n=>n>pos):list.filter(n=>n<pos).at(-1);if(n!==undefined){choose(n);focusTimeline()}}
$('previousCut').onclick=()=>boundary(-1);$('nextCut').onclick=()=>boundary(1);$('clipStart').onclick=()=>{if(selected){choose(starts(selected.c));focusTimeline()}};$('clipLast').onclick=()=>{if(selected){choose(ends(selected.c)-1);focusTimeline()}};
$('copy').onclick=async()=>{const field=$('reference');try{if(navigator.clipboard)await navigator.clipboard.writeText(field.value);else{field.focus();field.select();if(!document.execCommand('copy'))throw Error()}$('copy').textContent='복사됨 · Chat에 붙여넣기'}catch{$('copy').textContent='아래 내용을 길게 눌러 복사';field.focus();field.select()}};
void poll();setInterval(()=>{if(!document.hidden)void poll()},2000);
</script></html>
