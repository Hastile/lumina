[project]
name = "lumina-engine"
version = "0.1.0"
description = "Lumina video editor engine: document model, commands, analysis, RPC and MCP server"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "websockets>=13",
    "mcp[cli]>=1.2",
    "pillow>=12.3.0",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
auto = ["anthropic>=2.0"]          # lumina auto: shot descriptions and edit planning with Claude
transcribe = ["faster-whisper>=1.0"]  # local speech-to-text for library transcripts

[project.scripts]
lumina = "lumina.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
